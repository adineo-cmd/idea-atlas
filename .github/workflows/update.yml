name: atlas-update

# The pipeline from docs/PLAN.md Task 5: every 6 hours, refetch live debate
# sources, re-map the atlas, run tests, commit refreshed data, deploy Pages.
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: atlas-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch live debate sources
        run: python scripts/fetch.py --out data/live

      - name: Re-map the atlas
        run: python scripts/map.py
        env:
          AI_API_URL: ${{ secrets.AI_API_URL }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL }}

      - name: Sample dead links (advisory)
        run: python scripts/check_links.py || true

      - name: Run tests
        run: pytest scripts/tests/ -q

      - name: Commit refreshed data
        run: |
          git config user.name "atlas-bot"
          git config user.email "actions@github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore(atlas): refresh data $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }} # pick up the data commit pushed above

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
