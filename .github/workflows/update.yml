name: atlas-update

# Every 6 hours (and on every push to main): refetch live debate sources,
# re-map the atlas, run tests, and commit refreshed data. The data commit
# pushes to main, which triggers deploy.yml to rebuild Astro and deploy Pages.
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: atlas-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r scripts/requirements-dev.txt

      - name: Fetch live debate sources
        run: python scripts/fetch.py --out data/live

      - name: Re-map the atlas
        run: python scripts/map.py
        env:
          AI_API_URL: ${{ secrets.AI_API_URL }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL }}

      - name: Sync data into the Astro public dir
        run: |
          rm -rf public/data
          mkdir -p public/data
          cp -r data/index.json data/categories.json data/meta.json data/c data/seed public/data/

      - name: Sample dead links (advisory)
        run: python scripts/check_links.py || true

      - name: Run tests
        run: pytest scripts/tests/ -q

      - name: Commit refreshed data
        run: |
          git config user.name "atlas-bot"
          git config user.email "actions@github.com"
          git add data public/data
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore(atlas): refresh data $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
